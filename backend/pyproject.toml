[project]
name = "dataana-python"
version = "0.4.0"
description = "Interview-oriented Python/LangGraph rewrite of DataAna"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "langchain>=1.3,<2",
  "langchain-core>=1.6,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.0,<4",
  "aiosqlite>=0.21,<1",
  "langchain-openai>=1.0,<2",
  "langchain-mcp-adapters>=0.3,<1",
  "sqlalchemy>=2.0,<3",
  "pymysql>=1.1,<2",
  "sqlglot>=27,<30",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6.0,<7",
  "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
