server {
    # 拒绝通过服务器 IP 或其它 Host 访问 HTTP。
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name wanqing.cyou;
    return 301 https://$host$request_uri;
}

server {
    # 拒绝未匹配 wanqing.cyou 的 HTTPS 请求（包括直接访问 IP）。
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/wanqing.cyou/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanqing.cyou/privkey.pem;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wanqing.cyou;

    ssl_certificate /etc/letsencrypt/live/wanqing.cyou/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wanqing.cyou/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 302 /DataAna/;
    }

    location = /DataAna {
        return 301 /DataAna/;
    }

    # mcp-echarts 将图表上传到 MinIO 的 dataana-charts bucket。
    # 对外统一走 HTTPS，避免 HTTPS 页面加载 HTTP 图片时被浏览器拦截。
    location /dataana-charts/ {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /DataAna/ {
        proxy_pass http://127.0.0.1:8889/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        return 302 /DataAna/;
    }
}
