services:
  mysql:
    image: mysql:8.0
    container_name: dataana-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: dodo_agentx
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - dataana_mysql:/var/lib/mysql
      - ../sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - dataana
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --protocol=TCP -P 3306 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: dataana-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - dataana_minio:/data
    networks:
      dataana:
        ipv4_address: 172.25.0.10
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/minio:latest
    container_name: dataana-minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing local/$$MINIO_BUCKET_NAME &&
      mc anonymous set download local/$$MINIO_BUCKET_NAME
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-dataana-charts}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - dataana

  minio-public-proxy:
    image: alpine/socat:1.8.0.0
    container_name: dataana-minio-public-proxy
    restart: unless-stopped
    command: ["tcp-listen:19000,fork,reuseaddr", "tcp-connect:minio:9000"]
    ports:
      - "127.0.0.1:${MINIO_PUBLIC_PORT:-19000}:19000"
    networks:
      dataana:
        ipv4_address: 172.25.0.11
    depends_on:
      minio:
        condition: service_healthy

  mcp-echarts:
    build:
      context: .
      dockerfile: mcp-echarts.Dockerfile
    image: dataana-mcp-echarts:0.7.1
    container_name: dataana-mcp-echarts
    restart: unless-stopped
    environment:
      MINIO_ENDPOINT: ${DATAANA_PUBLIC_HOST:?DATAANA_PUBLIC_HOST is required}
      MINIO_PORT: ${MINIO_PUBLIC_PORT:-19000}
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-dataana-charts}
    extra_hosts:
      - "${DATAANA_PUBLIC_HOST}:172.25.0.11"
    depends_on:
      minio-public-proxy:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3033:3033"
    networks:
      - dataana

  app:
    build:
      context: ..
      dockerfile: deploy/python_backend.Dockerfile
    image: dataana-python:local
    container_name: dataana-app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/dodo_agentx?charset=utf8mb4
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY is required}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_TEMPERATURE: ${DEEPSEEK_TEMPERATURE:-0.2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CHECKPOINT_PATH: /opt/dataana/python_backend/.data/langgraph_checkpoints.sqlite3
      CHART_MCP_ENABLED: "true"
      CHART_MCP_URL: http://mcp-echarts:3033/mcp
      BIRD_EVAL_ENABLED: "false"
    volumes:
      - dataana_python_state:/opt/dataana/python_backend/.data
    depends_on:
      mysql:
        condition: service_healthy
      mcp-echarts:
        condition: service_started
    ports:
      - "127.0.0.1:${DATAANA_PORT:-8889}:8889"
    networks:
      - dataana

networks:
  dataana:
    name: dataana
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  dataana_mysql:
    name: dataana_mysql
  dataana_minio:
    name: dataana_minio
  dataana_python_state:
    name: dataana_python_state
